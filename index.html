<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FiveM Live Collaborative Map</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Google Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }
    #map {
      width: 100vw;
      height: 100vh;
      background-color: #0b0f19;
      cursor: crosshair;
    }
    /* Custom Leaflet Dark Popup Styles */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: #1e293b !important;
      color: #f8fafc !important;
      border: 1px solid #334155;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border-radius: 0.875rem !important;
    }
    .leaflet-popup-content {
      margin: 12px 14px !important;
      line-height: 1.4 !important;
    }
    .leaflet-container a.leaflet-popup-close-button {
      color: #94a3b8 !important;
      padding: 8px !important;
    }
    .leaflet-container a.leaflet-popup-close-button:hover {
      color: #f8fafc !important;
    }
    .leaflet-control-attribution {
      display: none !important;
    }
    /* Custom Map Pin Pulse Effect */
    @keyframes pin-pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.18); opacity: 0.85; }
      100% { transform: scale(1); opacity: 1; }
    }
    .ping-marker-active {
      animation: pin-pulse 2.5s infinite ease-in-out;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar { height: 4px; width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen w-screen select-none">

  <header class="absolute top-3 left-3 right-3 z-[1000] flex flex-wrap items-center justify-between gap-3 bg-slate-900/90 backdrop-blur-md px-4 py-2.5 rounded-2xl border border-slate-700/60 shadow-2xl">
    
    <!-- Left: Branding & Search -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 bg-slate-800/90 px-3 py-1.5 rounded-xl border border-slate-700">
        <i class="fa-solid fa-map-location-dot text-indigo-400 text-lg"></i>
        <span class="font-bold text-sm tracking-wide bg-gradient-to-r from-indigo-400 via-cyan-400 to-emerald-400 bg-clip-text text-transparent">FiveM Intel Map</span>
      </div>

      <!-- Search Box -->
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
        <input type="text" id="searchInput" placeholder="Search markers & zones..." 
               class="bg-slate-800/90 text-xs text-slate-100 pl-8 pr-3 py-2 rounded-xl border border-slate-700 focus:outline-none focus:border-indigo-500 w-36 sm:w-48 transition-all">
      </div>
    </div>

    <!-- Center: Mode Switcher & Shading Controls -->
    <div class="flex flex-wrap items-center gap-3">
      <div class="flex items-center bg-slate-800 p-1 rounded-xl border border-slate-700/80 shadow-inner">
        <button id="modePingBtn" class="mode-btn flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all bg-indigo-600 text-white shadow">
          <i class="fa-solid fa-location-dot"></i> Add Ping
        </button>
        <button id="modeShadeBtn" class="mode-btn flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all">
          <i class="fa-solid fa-draw-polygon"></i> Add Shading
        </button>
      </div>

      <!-- Shading Customization Controls -->
      <div id="shadingControls" class="hidden flex items-center gap-3 bg-slate-800/90 border border-slate-700 px-3 py-1 rounded-xl text-xs">
        <!-- Brush Size -->
        <div class="flex items-center gap-1.5" title="Brush Size">
          <i class="fa-solid fa-paint-brush text-slate-400 text-[11px]"></i>
          <input type="range" id="brushSizeInput" min="2" max="40" value="12" class="w-16 accent-indigo-500 cursor-pointer">
          <span id="brushSizeVal" class="text-[11px] text-slate-300 w-5 text-right font-mono">12px</span>
        </div>

        <div class="w-px h-4 bg-slate-700"></div>

        <!-- Opacity Slider -->
        <div class="flex items-center gap-1.5" title="Opacity / Transparency">
          <i class="fa-solid fa-circle-half-stroke text-slate-400 text-[11px]"></i>
          <input type="range" id="shadeOpacityInput" min="10" max="100" value="40" class="w-16 accent-indigo-500 cursor-pointer">
          <span id="shadeOpacityVal" class="text-[11px] text-slate-300 w-8 text-right font-mono">40%</span>
        </div>

        <div class="w-px h-4 bg-slate-700"></div>

        <!-- Custom Shading Color Picker -->
        <div class="flex items-center gap-1.5" title="Shading Color">
          <i class="fa-solid fa-palette text-slate-400 text-[11px]"></i>
          <input type="color" id="shadeColorInput" value="#3b82f6" class="w-5 h-5 bg-transparent border-0 cursor-pointer rounded">
        </div>
      </div>
    </div>

    <!-- Right: Category Creation & Sync Status -->
    <div class="flex items-center gap-2">
      <button id="openCategoryModalBtn" class="flex items-center gap-1.5 px-3 py-1.5 bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/50 rounded-xl text-xs font-semibold text-emerald-300 transition shadow-sm">
        <i class="fa-solid fa-plus text-emerald-400"></i> Add Category
      </button>

      <button id="clearAllBtn" class="flex items-center gap-1.5 px-3 py-1.5 bg-red-900/20 hover:bg-red-900/40 border border-red-700/50 text-red-300 rounded-xl text-xs font-medium transition">
        <i class="fa-solid fa-trash-can"></i> Clear
      </button>
      
      <!-- Realtime Sync Badge -->
      <div id="syncBadge" class="flex items-center gap-1.5 px-2.5 py-1.5 bg-slate-800 rounded-xl border border-slate-700 text-[11px] text-slate-400">
        <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse" id="syncDot"></span>
        <span id="syncText">Offline Mode</span>
      </div>
    </div>
  </header>

  <!-- Top Category Legend Bar -->
  <div class="absolute top-20 left-3 right-3 z-[999] flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar pointer-events-auto" id="categoryLegendBar">
    <!-- Dynamic Category Legend Chips injected here -->
  </div>

  <!-- Leaflet Map Container -->
  <div id="map"></div>

  <!-- Ping Creation Modal -->
  <div id="pingModal" class="fixed inset-0 z-[2000] hidden flex items-center justify-center bg-black/60 backdrop-blur-xs p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <h3 class="text-sm font-bold text-slate-100 flex items-center gap-2">
          <i class="fa-solid fa-location-dot text-indigo-400"></i> Place Marker Ping
        </h3>
        <button id="closePingModal" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Ping Name / Description</label>
        <input type="text" id="pingNameInput" placeholder="e.g., Crafting Bench, Meth Lab, Vault" 
               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Category</label>
        <select id="pingCategorySelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500 capitalize">
          <!-- Populated dynamically without hex codes -->
        </select>
      </div>

      <!-- Color Preview Box (Without raw hex string) -->
      <div id="pingColorPreviewBox" class="flex items-center gap-2.5 bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/60">
        <span id="pingColorSwatch" class="w-4 h-4 rounded-full shadow border border-black/30"></span>
        <span id="pingColorText" class="text-xs text-slate-300 font-semibold">Category Color</span>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button id="cancelPingBtn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs font-medium transition">Cancel</button>
        <button id="savePingBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-xs font-semibold text-white transition shadow-md">Place Ping</button>
      </div>
    </div>
  </div>

  <!-- Custom Category Creation Modal -->
  <div id="categoryModal" class="fixed inset-0 z-[2000] hidden flex items-center justify-center bg-black/60 backdrop-blur-xs p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <h3 class="text-sm font-bold text-slate-100 flex items-center gap-2">
          <i class="fa-solid fa-tag text-emerald-400"></i> Add Custom Category
        </h3>
        <button id="closeCategoryModal" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Category Tag Name</label>
        <input type="text" id="catNameInput" placeholder="e.g. Police Stations, Gang Turf, Dealers" 
               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Associated Color</label>
        <div class="flex items-center gap-3 bg-slate-900 p-2 rounded-xl border border-slate-700">
          <input type="color" id="catColorInput" value="#10b981" class="h-8 w-12 bg-transparent cursor-pointer rounded border-0">
          <span id="catColorHex" class="text-xs font-mono text-slate-400 uppercase">Selected Color</span>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button id="cancelCatBtn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs font-medium transition">Cancel</button>
        <button id="saveCatBtn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl text-xs font-semibold text-white transition shadow-md">Add Category</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // State Variables
    let map;
    let currentMode = 'ping'; // 'ping' or 'shade'
    let selectedCategoryForShading = 'Crafting';
    let tempLatlng = null;
    let isDrawing = false;
    let currentPolyline = null;
    let currentPoints = [];

    // Right-click panning state
    let isRightClickPanning = false;
    let rightClickStartPos = { x: 0, y: 0 };

    // Default categories linked to specific colors
    let categories = [
      { id: 'Crafting', name: 'Crafting', color: '#3b82f6', visible: true },
      { id: 'Drugs', name: 'Drugs', color: '#ef4444', visible: true },
      { id: 'Heists', name: 'Heists/Crime', color: '#eab308', visible: true }
    ];

    let pingsStore = [];
    let shadingsStore = [];
    let leafletMarkers = {};
    let leafletShadings = {};

    // Firebase Initialization
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'fivem-map-app';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

    let db = null;
    let auth = null;
    let pingsColRef, shadingsColRef, categoriesColRef;

    if (firebaseConfig) {
      try {
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
        pingsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'pings');
        shadingsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'shadings');
        categoriesColRef = collection(db, 'artifacts', appId, 'public', 'data', 'categories');
      } catch (err) {
        console.warn("Firebase initialization skipped, using local fallback:", err);
      }
    }

    function saveLocalBackup() {
      try {
        localStorage.setItem('fivem_map_pings', JSON.stringify(pingsStore));
        localStorage.setItem('fivem_map_shadings', JSON.stringify(shadingsStore));
        localStorage.setItem('fivem_map_categories', JSON.stringify(categories));
      } catch (e) {}
    }

    function loadLocalBackup() {
      try {
        const p = localStorage.getItem('fivem_map_pings');
        const s = localStorage.getItem('fivem_map_shadings');
        const c = localStorage.getItem('fivem_map_categories');

        if (p) pingsStore = JSON.parse(p);
        if (s) shadingsStore = JSON.parse(s);
        if (c) {
          const loadedCats = JSON.parse(c);
          loadedCats.forEach(cat => {
            if (!categories.some(existing => existing.name === cat.name)) {
              categories.push(cat);
            }
          });
        }
      } catch (e) {}
    }

    async function initAuth() {
      if (!auth) return;
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (err) {
        console.warn("Auth process fallback:", err);
      }
    }

    if (auth) {
      onAuthStateChanged(auth, (user) => {
        const syncDot = document.getElementById('syncDot');
        const syncText = document.getElementById('syncText');
        if (user) {
          syncDot.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
          syncText.innerText = "Live Synced";
          setupRealtimeListeners();
        } else {
          syncDot.className = "w-2 h-2 rounded-full bg-amber-500";
          syncText.innerText = "Connecting...";
        }
      });
    }

    function initMap() {
      loadLocalBackup();

      const bounds = [[0, 0], [1000, 1000]];
      const imageUrl = 'https://r2.fivemanage.com/5wGi5zx33QLzqLkxqL7ZI/Gemini_Generated_Image_8xr7wn8xr7wn8xr7.jpg';

      map = L.map('map', {
        crs: L.CRS.Simple,
        minZoom: -2,
        maxZoom: 3,
        zoomSnap: 0.25,
        attributionControl: false
      });

      L.imageOverlay(imageUrl, bounds).addTo(map);
      map.fitBounds(bounds);

      // Disable default right click context menu on map container
      const mapContainer = document.getElementById('map');
      mapContainer.addEventListener('contextmenu', (e) => e.preventDefault());

      // Setup Right-Click Drag-to-Pan (when zoomed in beyond initial minZoom)
      mapContainer.addEventListener('mousedown', (e) => {
        if (e.button === 2) { // Right mouse button
          e.preventDefault();
          if (map.getZoom() > map.getMinZoom()) {
            isRightClickPanning = true;
            rightClickStartPos = { x: e.clientX, y: e.clientY };
            mapContainer.style.cursor = 'grab';
          }
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (isRightClickPanning && map) {
          const dx = e.clientX - rightClickStartPos.x;
          const dy = e.clientY - rightClickStartPos.y;
          rightClickStartPos = { x: e.clientX, y: e.clientY };
          map.panBy([-dx, -dy], { animate: false });
        }
      });

      window.addEventListener('mouseup', (e) => {
        if (e.button === 2 && isRightClickPanning) {
          isRightClickPanning = false;
          mapContainer.style.cursor = 'crosshair';
        }
      });

      map.on('click', handleMapClick);
      map.on('mousedown', handleMouseDown);
      map.on('mousemove', handleMouseMove);
      map.on('mouseup', handleMouseUp);

      renderCategoryLegend();
      updatePingsOnMap();
      updateShadingsOnMap();
    }

    const modePingBtn = document.getElementById('modePingBtn');
    const modeShadeBtn = document.getElementById('modeShadeBtn');
    const shadingControls = document.getElementById('shadingControls');

    const brushSizeInput = document.getElementById('brushSizeInput');
    const brushSizeVal = document.getElementById('brushSizeVal');
    const shadeOpacityInput = document.getElementById('shadeOpacityInput');
    const shadeOpacityVal = document.getElementById('shadeOpacityVal');
    const shadeColorInput = document.getElementById('shadeColorInput');

    brushSizeInput.addEventListener('input', (e) => {
      brushSizeVal.innerText = e.target.value + 'px';
    });

    shadeOpacityInput.addEventListener('input', (e) => {
      shadeOpacityVal.innerText = e.target.value + '%';
    });

    modePingBtn.addEventListener('click', () => {
      currentMode = 'ping';
      modePingBtn.className = "mode-btn flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all bg-indigo-600 text-white shadow";
      modeShadeBtn.className = "mode-btn flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all";
      shadingControls.classList.add('hidden');
      map.dragging.enable();
    });

    modeShadeBtn.addEventListener('click', () => {
      currentMode = 'shade';
      modeShadeBtn.className = "mode-btn flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all bg-indigo-600 text-white shadow";
      modePingBtn.className = "mode-btn flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all";
      shadingControls.classList.remove('hidden');
      map.dragging.disable();
    });

    function handleMapClick(e) {
      if (currentMode === 'ping' && !isRightClickPanning) {
        tempLatlng = e.latlng;
        openPingModal();
      }
    }

    function handleMouseDown(e) {
      if (currentMode !== 'shade' || e.originalEvent.button !== 0) return; // Left mouse click only for shading
      isDrawing = true;
      currentPoints = [e.latlng];

      const strokeWidth = parseInt(brushSizeInput.value, 10);
      const opacityVal = parseInt(shadeOpacityInput.value, 10) / 100;
      const shadeColor = shadeColorInput.value;

      currentPolyline = L.polyline(currentPoints, {
        color: shadeColor,
        weight: strokeWidth,
        opacity: opacityVal
      }).addTo(map);
    }

    function handleMouseMove(e) {
      if (!isDrawing || currentMode !== 'shade') return;
      currentPoints.push(e.latlng);
      currentPolyline.setLatLngs(currentPoints);
    }

    function handleMouseUp() {
      if (!isDrawing || currentMode !== 'shade') return;
      isDrawing = false;

      if (currentPoints.length > 2) {
        const catObj = categories.find(c => c.name === selectedCategoryForShading) || categories[0];
        const strokeWidth = parseInt(brushSizeInput.value, 10);
        const opacityVal = parseInt(shadeOpacityInput.value, 10) / 100;
        const shadeColor = shadeColorInput.value;

        const rawPoints = currentPoints.map(pt => [pt.lat, pt.lng]);
        const id = 'shade_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);

        const newShading = {
          id: id,
          points: rawPoints,
          category: catObj ? catObj.name : 'General',
          color: shadeColor,
          weight: strokeWidth,
          opacity: opacityVal,
          createdAt: Date.now()
        };

        if (db && auth?.currentUser) {
          saveShadingToFirestore(newShading);
        } else {
          shadingsStore.push(newShading);
          saveLocalBackup();
          updateShadingsOnMap();
        }
      }

      if (currentPolyline) {
        map.removeLayer(currentPolyline);
        currentPolyline = null;
      }
      currentPoints = [];
    }

    function renderCategoryLegend() {
      const container = document.getElementById('categoryLegendBar');
      container.innerHTML = '';

      const selectElem = document.getElementById('pingCategorySelect');
      selectElem.innerHTML = '';

      categories.forEach(cat => {
        // Render Top Legend Button (Clean Name + Color Circle Only, No Hex Text)
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = `flex items-center gap-2 px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all shadow-md ${
          cat.visible ? 'bg-slate-900/90 text-slate-100 border-slate-700' : 'bg-slate-950/60 text-slate-500 border-slate-800 opacity-50'
        }`;

        chip.innerHTML = `
          <span class="w-3 h-3 rounded-full shadow-sm border border-black/20" style="background-color: ${cat.color}"></span>
          <span>${cat.name}</span>
          <i class="fa-solid ${cat.visible ? 'fa-eye' : 'fa-eye-slash'} text-[10px] ml-1 text-slate-400"></i>
        `;

        chip.addEventListener('click', () => {
          cat.visible = !cat.visible;
          selectedCategoryForShading = cat.name;
          shadeColorInput.value = cat.color;
          renderCategoryLegend();
          applyCategoryFilters();
        });

        container.appendChild(chip);

        // Populate Add Ping Dropdown Options
        const option = document.createElement('option');
        option.value = cat.name;
        option.textContent = cat.name;
        selectElem.appendChild(option);
      });

      updatePingModalColorPreview();
    }

    function updatePingModalColorPreview() {
      const selectElem = document.getElementById('pingCategorySelect');
      const selectedName = selectElem.value;
      const catObj = categories.find(c => c.name === selectedName) || categories[0];

      if (catObj) {
        document.getElementById('pingColorSwatch').style.backgroundColor = catObj.color;
        document.getElementById('pingColorText').innerText = catObj.name;
      }
    }

    document.getElementById('pingCategorySelect').addEventListener('change', updatePingModalColorPreview);

    function applyCategoryFilters() {
      const activeCatNames = categories.filter(c => c.visible).map(c => c.name);
      const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();

      pingsStore.forEach(ping => {
        const marker = leafletMarkers[ping.id];
        if (marker) {
          const isCatVisible = activeCatNames.includes(ping.category);
          const matchesSearch = ping.name.toLowerCase().includes(searchVal) || ping.category.toLowerCase().includes(searchVal);
          if (isCatVisible && matchesSearch) {
            marker.addTo(map);
          } else {
            map.removeLayer(marker);
          }
        }
      });

      shadingsStore.forEach(shading => {
        const poly = leafletShadings[shading.id];
        if (poly) {
          const isCatVisible = activeCatNames.includes(shading.category);
          const matchesSearch = shading.category.toLowerCase().includes(searchVal);
          if (isCatVisible && matchesSearch) {
            poly.addTo(map);
          } else {
            map.removeLayer(poly);
          }
        }
      });
    }

    document.getElementById('searchInput').addEventListener('input', applyCategoryFilters);

    function setupRealtimeListeners() {
      if (!auth || !auth.currentUser) return;

      onSnapshot(pingsColRef, (snapshot) => {
        pingsStore = [];
        snapshot.forEach(docSnap => pingsStore.push(docSnap.data()));
        saveLocalBackup();
        updatePingsOnMap();
      }, (err) => console.error("Pings listener error:", err));

      onSnapshot(shadingsColRef, (snapshot) => {
        shadingsStore = [];
        snapshot.forEach(docSnap => shadingsStore.push(docSnap.data()));
        saveLocalBackup();
        updateShadingsOnMap();
      }, (err) => console.error("Shadings listener error:", err));

      onSnapshot(categoriesColRef, (snapshot) => {
        snapshot.forEach(docSnap => {
          const newCat = docSnap.data();
          const existingIdx = categories.findIndex(c => c.name === newCat.name);
          if (existingIdx >= 0) {
            categories[existingIdx].color = newCat.color;
          } else {
            categories.push({ ...newCat, visible: true });
          }
        });
        saveLocalBackup();
        renderCategoryLegend();
        updatePingsOnMap();
      }, (err) => console.error("Categories listener error:", err));
    }

    function createColorMarkerIcon(colorHex) {
      const svgIcon = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" width="30" height="40">
          <path fill="${colorHex}" stroke="#0f172a" stroke-width="25" d="M172.268 501.67C26.97 291.031 0 269.413 0 192 0 85.961 85.961 0 192 0s192 85.961 192 192c0 77.413-26.97 99.031-172.268 309.67-9.535 13.774-29.93 13.773-39.464 0z"/>
          <circle cx="192" cy="192" r="70" fill="#ffffff" />
          <circle cx="192" cy="192" r="45" fill="${colorHex}" />
        </svg>
      `;

      return L.divIcon({
        className: 'ping-marker-active',
        html: svgIcon,
        iconSize: [30, 40],
        iconAnchor: [15, 40],
        popupAnchor: [0, -36]
      });
    }

    function updatePingsOnMap() {
      const activeIds = pingsStore.map(p => p.id);
      Object.keys(leafletMarkers).forEach(id => {
        if (!activeIds.includes(id)) {
          map.removeLayer(leafletMarkers[id]);
          delete leafletMarkers[id];
        }
      });

      pingsStore.forEach(ping => {
        const catObj = categories.find(c => c.name === ping.category) || { color: '#3b82f6', name: ping.category };
        const iconColor = ping.color || catObj.color;

        if (!leafletMarkers[ping.id]) {
          const markerIcon = createColorMarkerIcon(iconColor);
          const marker = L.marker([ping.lat, ping.lng], { icon: markerIcon });

          const timeString = ping.createdAt ? new Date(ping.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

          const popupContent = document.createElement('div');
          popupContent.className = 'space-y-2 p-0.5';
          popupContent.innerHTML = `
            <div class="flex items-center gap-2 border-b border-slate-700/80 pb-2">
              <span class="w-3.5 h-3.5 rounded-full shadow border border-slate-900" style="background-color: ${iconColor}"></span>
              <span class="text-xs font-bold text-slate-100 tracking-wide">${ping.name}</span>
            </div>
            <div class="flex items-center justify-between text-[11px] text-slate-400">
              <span>Category: <strong class="text-slate-200">${ping.category}</strong></span>
              <span>${timeString}</span>
            </div>
            <button class="delete-ping-btn w-full mt-2 px-2.5 py-1.5 bg-red-950/40 hover:bg-red-900/70 border border-red-700/60 rounded-xl text-[11px] text-red-300 font-semibold transition flex items-center justify-center gap-1.5">
              <i class="fa-solid fa-trash-can text-[10px]"></i> Delete Marker
            </button>
          `;

          popupContent.querySelector('.delete-ping-btn').addEventListener('click', () => {
            deletePing(ping.id);
          });

          marker.bindPopup(popupContent);
          leafletMarkers[ping.id] = marker;
        } else {
          leafletMarkers[ping.id].setIcon(createColorMarkerIcon(iconColor));
        }
      });

      applyCategoryFilters();
    }

    function updateShadingsOnMap() {
      const activeIds = shadingsStore.map(s => s.id);
      Object.keys(leafletShadings).forEach(id => {
        if (!activeIds.includes(id)) {
          map.removeLayer(leafletShadings[id]);
          delete leafletShadings[id];
        }
      });

      shadingsStore.forEach(shading => {
        if (!leafletShadings[shading.id]) {
          const opacityVal = shading.opacity !== undefined ? shading.opacity : 0.38;
          const weightVal = shading.weight !== undefined ? shading.weight : 3;

          const polygon = L.polygon(shading.points, {
            color: shading.color,
            fillColor: shading.color,
            fillOpacity: opacityVal,
            weight: weightVal
          });

          const popupContent = document.createElement('div');
          popupContent.className = 'space-y-2 p-0.5';
          popupContent.innerHTML = `
            <div class="flex items-center gap-2">
              <span class="w-3 h-3 rounded-full" style="background-color: ${shading.color}"></span>
              <span class="text-xs font-bold text-slate-100">Shaded Area (${shading.category})</span>
            </div>
            <button class="delete-shade-btn w-full mt-1 px-2.5 py-1.5 bg-red-950/40 hover:bg-red-900/70 border border-red-700/60 rounded-xl text-[11px] text-red-300 font-semibold transition flex items-center justify-center gap-1.5">
              <i class="fa-solid fa-trash-can text-[10px]"></i> Delete Shading
            </button>
          `;

          popupContent.querySelector('.delete-shade-btn').addEventListener('click', () => {
            deleteShading(shading.id);
          });

          polygon.bindPopup(popupContent);
          leafletShadings[shading.id] = polygon;
        }
      });

      applyCategoryFilters();
    }

    async function savePingToFirestore(ping) {
      if (!auth?.currentUser) return;
      try {
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'pings', ping.id), ping);
      } catch (err) {
        console.error("Error saving ping:", err);
      }
    }

    async function deletePing(id) {
      if (db && auth?.currentUser) {
        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'pings', id));
        } catch (err) {}
      } else {
        pingsStore = pingsStore.filter(p => p.id !== id);
        saveLocalBackup();
        updatePingsOnMap();
      }
    }

    async function saveShadingToFirestore(shading) {
      if (!auth?.currentUser) return;
      try {
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'shadings', shading.id), shading);
      } catch (err) {
        console.error("Error saving shading:", err);
      }
    }

    async function deleteShading(id) {
      if (db && auth?.currentUser) {
        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'shadings', id));
        } catch (err) {}
      } else {
        shadingsStore = shadingsStore.filter(s => s.id !== id);
        saveLocalBackup();
        updateShadingsOnMap();
      }
    }

    async function saveCategoryToFirestore(cat) {
      if (!auth?.currentUser) return;
      try {
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'categories', cat.name), cat);
      } catch (err) {
        console.error("Error saving category:", err);
      }
    }

    // Modal Events
    const pingModal = document.getElementById('pingModal');
    const categoryModal = document.getElementById('categoryModal');

    function openPingModal() {
      document.getElementById('pingNameInput').value = '';
      updatePingModalColorPreview();
      pingModal.classList.remove('hidden');
    }

    function closePingModal() {
      pingModal.classList.add('hidden');
      tempLatlng = null;
    }

    document.getElementById('closePingModal').addEventListener('click', closePingModal);
    document.getElementById('cancelPingBtn').addEventListener('click', closePingModal);

    document.getElementById('savePingBtn').addEventListener('click', () => {
      const name = document.getElementById('pingNameInput').value.trim();
      const category = document.getElementById('pingCategorySelect').value;

      if (!name || !tempLatlng) return;

      const catObj = categories.find(c => c.name === category) || { color: '#3b82f6' };

      const newPing = {
        id: 'ping_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
        name: name,
        category: category,
        color: catObj.color,
        lat: tempLatlng.lat,
        lng: tempLatlng.lng,
        createdAt: Date.now()
      };

      if (db && auth?.currentUser) {
        savePingToFirestore(newPing);
      } else {
        pingsStore.push(newPing);
        saveLocalBackup();
        updatePingsOnMap();
      }

      closePingModal();
    });

    document.getElementById('openCategoryModalBtn').addEventListener('click', () => {
      document.getElementById('catNameInput').value = '';
      categoryModal.classList.remove('hidden');
    });

    function closeCategoryModal() {
      categoryModal.classList.add('hidden');
    }

    document.getElementById('closeCategoryModal').addEventListener('click', closeCategoryModal);
    document.getElementById('cancelCatBtn').addEventListener('click', closeCategoryModal);

    const catColorInput = document.getElementById('catColorInput');
    const catColorHex = document.getElementById('catColorHex');
    catColorInput.addEventListener('input', (e) => {
      catColorHex.style.color = e.target.value;
    });

    document.getElementById('saveCatBtn').addEventListener('click', () => {
      const name = document.getElementById('catNameInput').value.trim();
      const color = catColorInput.value;

      if (!name) return;

      const newCat = { name: name, color: color };
      const existingIdx = categories.findIndex(c => c.name === name);

      if (existingIdx >= 0) {
        categories[existingIdx].color = color;
      } else {
        categories.push({ ...newCat, visible: true });
      }

      renderCategoryLegend();

      if (db && auth?.currentUser) {
        saveCategoryToFirestore(newCat);
      } else {
        saveLocalBackup();
      }

      closeCategoryModal();
    });

    document.getElementById('clearAllBtn').addEventListener('click', () => {
      pingsStore.forEach(ping => deletePing(ping.id));
      shadingsStore.forEach(shading => deleteShading(shading.id));
    });

    window.onload = async () => {
      await initAuth();
      initMap();
    };
  </script>
</body>
</html>
